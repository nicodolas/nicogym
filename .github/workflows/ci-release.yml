name: Verify and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  API_BASE_URL: https://nicogym-api-huit.vercel.app
  BASE_APP_VERSION: 1.1.1+5

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/validate-release-config.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run api:test
      - run: npm run api:typecheck
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - working-directory: apps/client
        run: flutter pub get
      - working-directory: apps/client
        run: flutter analyze
      - working-directory: apps/client
        run: flutter test
      - working-directory: apps/client
        run: >-
          flutter build web --release
          --no-web-resources-cdn
          --pwa-strategy=none
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=BASE_APP_VERSION=${{ env.BASE_APP_VERSION }}
          --dart-define=APK_DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/latest/download/nicogym-android.apk

  release-apk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/client/android
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "../upload-keystore.jks" > key.properties
      - working-directory: apps/client
        run: flutter pub get
      - run: node scripts/validate-release-config.mjs
      - working-directory: apps/client
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: >-
          shorebird release android
          --artifact apk
          --flutter-version 3.44.9
          --
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=BASE_APP_VERSION=${{ env.BASE_APP_VERSION }}
      - name: Prepare release asset
        run: |
          cp apps/client/build/app/outputs/flutter-apk/app-release.apk nicogym-android.apk
          sha256sum nicogym-android.apk > nicogym-android.apk.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          nicogym-android.apk nicogym-android.apk.sha256
          --verify-tag --generate-notes
